<style>

<div class="m"><div class="top"><span class="sub" id="cr" style="margin:0"></span><button class="btn" onclick="theme()">🌙 / ☀️</button></div><div class="pg" id="c"></div></div></div>

<script>
const $=s=>document.querySelector(s),R=document.documentElement;
try{const x=localStorage.getItem('th');if(x)R.setAttribute('data-theme',x)}catch(e){}

const toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',5500)};
const openM=h=>{$('#mb').innerHTML=h;$('#ov').style.display='flex'},closeM=()=>{$('#ov').style.display='none';$('#mb').innerHTML=''};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const now=()=>new Date().toLocaleString('es-AR'),fm=n=>'$'+(+n||0).toLocaleString('es-AR');

const db={log:[],ctacte:[],tc:[],tcp:[],civaHist:[{desde:'2026-01-01',civa:'Resp. Inscripto'}],presupuestos:[],gastos:[],coop:{razon:'Cooperativa de Trabajo (ejemplo)',fantasia:'',cuit:'',civa:'Resp. Inscripto',cierre:'31/12',dom:'',tel:'',mail:'',web:'',logo:'',firma:'',ftxt:'',cond:'Precios sin IVA salvo indicación. Validez según presupuesto.'}};
const add=(t,o)=>{o.id=nid++;const x=PX[t];if(x){const k=x[0]+(x[1]?'-'+new Date().getFullYear():'');cnt[k]=(cnt[k]||0)+1;o.cod=k+'-'+String(cnt[k]).padStart(5,'0')}db[t].push(o);return o};
const get=v=>{if(!v||v==='coop')return null;const[t,i]=v.split(':');return db[t]&&db[t].find(r=>r.id==i)};
const L=(t,r)=>{if(!r)return '—';if(t==='establecimientos')return LV(r.cliente)+' / '+r.nombre;if(t==='ots')return r.cod+' · '+r.servicio+' · '+LV(r.estab);if(t==='fprov')return r.cod+' · '+LV(r.prov);if(t==='presupuestos')return r.cod+' v'+r.ver;if(t==='bancos')return titL(r.titular);if(!S[t])return r.cod||('#'+r.id);return r[S[t].f[0][0]]};
const LV=v=>v==='coop'?'Cooperativa':v?L(v.split(':')[0],get(v)):'—';
const TN={clientes:'Cliente',establecimientos:'Establecimiento',asociados:'Asociado',proveedores:'Proveedor'},titL=v=>!v?'—':v==='coop'?'Cooperativa':(TN[v.split(':')[0]]||'')+' · '+LV(v);

const syncC=v=>{const ref='clientes:'+v.id;let c=db.contactos.find(x=>x.cliente===ref&&x.rol==='Principal');if(!v.cnom&&!c)return;if(!c)c=add('contactos',{cliente:ref,rol:'Principal'});c.nombre=v.cnom;c.cel=v.ctel;c.mail=v.cmail};
const syncB=(t,v)=>{if(!(v.banco||v.cbu||v.alias))return;const ref=t+':'+v.id;let b=db.bancos.find(x=>x.titular===ref&&x.ppal==='Sí');if(!b)b=add('bancos',{titular:ref,ppal:'Sí'});b.banco=v.banco;b.cbu=v.cbu;b.alias=v.alias};

clientes:{t:'Clientes',d:'Al crear un cliente se genera solo su Establecimiento principal y su contacto principal. No se admiten documentos duplicados.',

establecimientos:{t:'Establecimientos',d:'Sedes/plantas del cliente. Un cliente siempre tiene al menos uno (el principal).',f:[['cliente','Cliente','ref',{t:'clientes'}],['nombre','Nombre / identificador del sitio','text'],['dir','Dirección','text'],['loc','Localidad – Código postal','ref',LS('Localidad – Código postal','—'),1],['rubro','Actividad / rubro','ref',LS('Actividad / Rubro','—')],['lnom','Contacto local (nombre)','text'],['ltel','Contacto local (teléfono)','text',0,1],['lmail','Contacto local (e-mail)','text',0,1],['ppal','Principal','sel',['Sí','No']]]},
contactos:{t:'Contactos',d:'Varios por cliente, opcionalmente asignados a un establecimiento (límite blando configurable).',f:[['cliente','Cliente','ref',{t:'clientes'}],['estab','Establecimiento','ref',{t:'establecimientos',b:'— (todo el cliente)',dep:'cliente'}],['nombre','Nombre','text'],['rol','Rol','sel',['Principal','Pagos','Técnico','Decisor']],['cel','Celular','text'],['mail','E-mail','text']],
 val:(v,id)=>get(v.estab)&&get(v.estab).cliente!==v.cliente?'El establecimiento no pertenece al cliente elegido.':db.contactos.filter(r=>r.cliente===v.cliente&&r.id!=id).length>=cfg.max?'Límite de contactos por cliente alcanzado ('+cfg.max+', configurable).':''},
bancos:{t:'Cuentas bancarias',d:'Varias por titular: Cooperativa, cliente, establecimiento, asociado o proveedor/subcontratista. Cada cuenta pertenece a UN solo titular y una de ellas es la principal.',f:[['titular','Titular','tit'],['banco','Banco','ref',LS('Bancos')],['cbu','CBU','text'],['alias','Alias','text'],['ppal','Principal','sel',['Sí','No']]],
 val:(v,id)=>!v.titular?'Elegí el titular de la cuenta.':db.bancos.filter(r=>r.titular===v.titular&&r.id!=id).length>=cfg.max?'Límite de cuentas por titular alcanzado ('+cfg.max+', configurable).':'',after:v=>fixP(v),upd:v=>fixP(v)},

 f:[['nombre','Apellido y nombre','text'],['tdoc','Tipo documento','sel',['CUIT','CUIL'],1],['ndoc','Número documento (CUIT/CUIL)','text'],['dni','DNI','text',0,1],['civa','Condición ante IVA','sel',['Monotributo','Exento','Resp. Inscripto']],['nac','Fecha de nacimiento','date',0,1],['vinculo','Tipo de vínculo','sel',['Socio cooperativo','Monotributista/Autónomo','Ambos']],['esp','Especialidad','ref',LS('Especialidad','—')],['matricula','Matrícula profesional','text',0,1],['vmat','Vencimiento de matrícula','date'],['banco','Banco','ref',LS('Bancos','—'),1],['cbu','CBU','text',0,1],['alias','Alias','text',0,1],['tel','Teléfono','text',0,1],['mail','E-mail','text',0,1],['dom','Domicilio','text',0,1],['loc','Localidad – Código postal','ref',LS('Localidad – Código postal','—'),1],['cat','Categoría de monotributo','ref',LS('Categorías de monotributo','—'),1],['perio','Periodicidad del control','sel',['Semestral','Anual'],1],['aniv','Aniversario del período','date',0,1],['logo','Logo propio (opcional)','img',0,1],['firma','Firma digital (imagen)','img',0,1],['ftxt','Texto de firma (nombre, título, matrícula)','text',0,1],['estado','Estado','sel',['Activo','Inactivo','Baja']],['alta','Fecha de alta','date',0,1],['baja','Fecha de baja','date',0,1],['obs','Observación','text',0,1]],
 val:dup('asociados','tdoc','ndoc'),after:v=>{syncB('asociados',v)},upd:v=>syncB('asociados',v)},
proveedores:{t:'Proveedores / Subcontratistas',d:'Una sola tabla. Subcontrato solo ofrece los de tipo Subcontratista o Ambos.',f:[['fantasia','Nombre de fantasía','text'],['razon','Razón social','text'],['tipo','Tipo','sel',['Proveedor','Subcontratista','Ambos']],['tdoc','Tipo de documento','sel',['CUIT','CUIL','DNI'],1],['ndoc','Número de documento (CUIT/CUIL/DNI)','text'],['civa','Condición ante IVA','sel',['Resp. Inscripto','Monotributo','Exento'],1],['cnom','Contacto (apellido y nombre)','text'],['ctel','Contacto (teléfono)','text',0,1],['cmail','Contacto (e-mail)','text',0,1],['banco','Banco','ref',LS('Bancos','—'),1],['cbu','CBU','text',0,1],['alias','Alias','text',0,1],['estado','Estado','sel',['Activo','Inactivo','Baja']],['alta','Fecha de alta','date',0,1],['baja','Fecha de baja','date',0,1],['obs','Observación','text',0,1]],
 val:dup('proveedores','tdoc','ndoc'),after:v=>{syncB('proveedores',v)},upd:v=>syncB('proveedores',v)},
servicios:{t:'Servicios',d:'El precio ARS se precarga en los presupuestos (modificable allí). Con "Actualizar a valor dólar = Sí" se recalcula con el último tipo de cambio.',
 f:[['nombre','Nombre','text'],['cat','Categoría','ref',LS('Categoría de servicio','—')],['sub','Subcategoría','text',0,1],['desc','Descripción','text',0,1],['unidad','Unidad de medida','ref',LS('Unidad de medida')],['ars','Precio ref. ARS (sin IVA)','num'],['usd','Precio ref. USD (sin IVA)','num'],['vig','Vigente desde','date',0,1],['estado','Estado','sel',['Activo','Inactivo']],['actd','Actualizar a valor dólar','sel',['No','Sí']],['obs','Observación','text',0,1]],

medios:{t:'Medios de pago',d:'Los instrumentos diferidos (ej. e-cheq) tienen días de acreditación.',f:[['nombre','Medio','text'],['acred','Días de acreditación','num']]},
condiciones:{t:'Condiciones de pago',d:'Los días se usan para calcular vencimientos.',f:[['nombre','Condición','text'],['dias','Días','num']]},

plantillas:{t:'Plantillas de presupuesto',d:'Base de modelos para imprimir / ver el presupuesto en PDF: imágenes de cabecera, pie y firma digital. Queda preparada para integrar cuando se definan los modelos; el armado en pantalla no cambia.',f:[['nombre','Nombre','text'],['tipo','Variante','sel',['Explicativa','Compacta','Otra']],['cab','Imagen de cabecera (logo)','img'],['pie','Imagen de pie de página','img'],['marca','Marca de agua (opcional)','img'],['cond','Texto de condiciones / pie','text',0,1],['pred','Predeterminada','sel',['No','Sí']],['activa','Activa','sel',['Sí','No']]],after:r=>fixPl(r),upd:r=>fixPl(r)},
sm:{t:'Servicios Mensuales',d:'Contrato marco. "Generar período" crea la OT del mes; en modo automático se crean solas (Configuración).',f:[['cliente','Cliente','ref',{t:'clientes'}],['estab','Establecimiento','ref',{t:'establecimientos',dep:'cliente'}],['servicio','Servicio','ref',{t:'servicios'}],['precio','Precio mensual','num'],['dia','Día de generación','num'],['dini','Día de inicio del servicio','num'],['fin','Fin previsto (alerta)','date'],['resp','Responsable por defecto','ref',{t:'asociados',b:'—',x:AC}],['obs','Observación','text',0,1]],

function addCat(){const d=document.createElement('div');d.className='pn gcat';d.innerHTML=`<label>Categoría</label><select class="gc" style="max-width:260px">${db.categorias.map(c=>`<option value="categorias:${c.id}">${c.nombre}</option>`).join('')}</select> <a class="lk" onclick="this.closest('.gcat').remove();gtot()">quitar categoría</a><table><tr><th>Concepto</th><th>Proveedor</th><th>N.º factura prov.</th><th>Importe</th><th>IVA</th><th>Afecta margen</th><th>Comprobante</th><th>Total</th><th></th></tr></table><a class="lk" onclick="addCon(this.closest('.gcat'))">+ concepto</a>`;$('#gcats').appendChild(d);d.querySelector('.gc').onchange=()=>d.querySelectorAll('.ga2').forEach(s=>s.value=(get(d.querySelector('.gc').value)||{}).afecta||'Sí');addCon(d)}

function okRvCobro(id){const c=db.cobros.find(x=>x.id==id),m=motivo2();if(!m)return;c.anulado=true;c.fanu=hoy();c.manu=m;

function evs(all){const e=[];
db.ots.forEach(o=>{const tp=o.smid?'sm':'ot';if(o.estado==='Autorizada')e.push({f:o.inicio,tp,x:'Inicio '+o.cod+' · '+LV(o.cliente)});else if(o.estado!=='Cancelada')e.push({f:o.ireal||o.inicio,tp,x:o.cod+' iniciada · '+LV(o.cliente),done:1})});
db.facturas.forEach(f=>{const cs=f.lineas.map(l=>get(l.ot).cod).join(', ');if(f.estado==='Borrador'){e.push({f:f.fdec,tp:'fact',x:'Completar factura de anticipo '+cs})}else if(!f.esnc&&!f.esnd){const sal=fSaldo(f);if(sal>eps)e.push({f:f.venc||f.fecha,tp:'fact',x:'Vence '+f.cod+' · '+LV(f.cliente)+' (saldo '+fm(sal)+')'});else e.push({f:f.fecha,tp:'fact',x:f.cod+' cobrada',done:1});if(f.fdec)e.push({f:f.femi||f.fdec,tp:'fact',x:'Factura de anticipo '+cs+' emitida',done:1})}});

db.cobros.filter(c=>!c.anulado).forEach(c=>{if(c.disp>hoy())e.push({f:c.disp,tp:'cobro',x:'Disponible '+c.cod+' ('+fm(c.importe)+')'});else e.push({f:c.disp,tp:'cobro',x:c.cod+' disponible',done:1})});
db.presupuestos.forEach(p=>{if(cab(p)==='Enviado'){e.push({f:prox(p),tp:'seg',x:'Seguimiento '+p.cod+' v'+p.ver+' · '+LV(p.cliente)});e.push({f:venc(p),tp:'venc',x:'Vence '+p.cod+' v'+p.ver})}p.seg.forEach(x=>e.push({f:x.f,tp:'seg',x:'Seguimiento realizado '+p.cod+(x.n?' ('+x.n+')':''),done:1}))});
rfpAll();db.fprov.filter(f=>!f.anulada).forEach(f=>{if(f.estado==='Pagada')e.push({f:(f.pagos[f.pagos.length-1]||{}).f||f.venc,tp:'fprov',x:f.cod+' pagada · '+LV(f.prov),done:1});else e.push({f:f.venc,tp:'fprov',x:'Vence '+f.cod+' · '+LV(f.prov)+' (saldo '+fm(f.total-f.pagado)+')'})});

function addTCP(){const pe=$('#tpp').value,v=+$('#tpv').value;if(!pe||!(v>0)){toast('Completá período y valor.');return}const x=db.tcp.find(y=>y.p===pe);if(x){db.log.push({tk:'tcp',id:x.id,t:'TC promedio',campo:'Valor '+pe,a:x.v,d:v,f:now()});x.v=v;toast('Tipo de cambio promedio del período actualizado (queda en el historial).')}else{add('tcp',{p:pe,v});toast('Tipo de cambio promedio cargado.')}vCfg()}
function addTC(){const f=$('#tf').value,v=+$('#tv').value;if(!f||!(v>0)){toast('Completá fecha y valor.');return}db.tc.push({f,v});toast('Tipo de cambio cargado.');vCfg()}
function recalc(ids){const l=lastTC();if(!l){toast('Cargá primero un tipo de cambio.');return}let n=0;db.servicios.filter(x=>x.actd==='Sí'&&x.usd>0&&(!ids||ids.includes(x.id))).forEach(x=>{const nv=Math.round(x.usd*l.v);if(nv!==x.ars){db.log.push({tk:'servicios',id:x.id,t:'Servicios',campo:'Precio ARS (indexado al dólar)',a:x.ars,d:nv,f:now()});x.ars=nv;x.vig=l.f;n++}});toast(n+' servicio(s) actualizados al TC '+l.v+'. Los presupuestos ya emitidos no cambian (guardan su propio precio).');nav('servicios')}
const recSel=()=>{const ids=[...document.querySelectorAll('.sel:checked')].map(x=>+x.value);if(!ids.length){toast('Seleccioná al menos un servicio.');return}recalc(ids)};
function setCfg(k,v){cfg[k]=v;toast('Configuración guardada.');vCfg()}
function vCfg(){const sw=(k,t,d)=>`<label style="text-transform:none;font-size:13px;color:var(--t);margin:10px 0"><input type="checkbox" ${cfg[k]?'checked':''} style="width:auto" onchange="setCfg('${k}',this.checked)"> ${t}<span class="sub" style="display:block;margin:0 0 0 22px">${d}</span></label>`,nu=(k,t)=>`<label>${t}</label><input type="number" value="${cfg[k]}" style="width:120px" onchange="setCfg('${k}',+this.value)">`,se=(k,t,o)=>`<label>${t}</label><select style="width:auto" onchange="setCfg('${k}',this.value)">${o.map(([v,n])=>`<option value="${v}" ${cfg[k]===v?'selected':''}>${n}</option>`).join('')}</select>`;
$('#c').innerHTML=`<div class="h1">Configuración general</div><p class="sub">Parámetros globales del sistema.</p>
<div class="pn"><h3>Tipo de cambio (oficial, carga diaria)</h3><div style="display:flex;gap:8px;align-items:end;max-width:480px"><div><label>Fecha</label><input type="date" id="tf" value="${hoy()}"></div><div><label>Valor ARS por USD</label><input type="number" id="tv"></div><button class="btn primary" onclick="addTC()">Cargar</button></div><table style="margin-top:10px;max-width:320px"><tr><th>Fecha</th><th>Valor</th></tr>${[...db.tc].sort((a,b)=>b.f.localeCompare(a.f)).map(x=>`<tr><td>${x.f}</td><td>${fm(x.v)}</td></tr>`).join('')||'<tr><td class="sub">Sin cargas</td></tr>'}</table></div>
<div class="pn"><h3>Tipo de cambio promedio (por período)</h3><p class="sub">Se carga una vez por período (mes) como dato propio: no se calcula con los tipos de cambio diarios y se mantiene separado de ellos.</p><div style="display:flex;gap:8px;align-items:end;max-width:480px"><div><label>Período</label><input type="month" id="tpp" value="${hoy().slice(0,7)}"></div><div><label>Valor ARS por USD</label><input type="number" id="tpv"></div><button class="btn primary" onclick="addTCP()">Cargar</button></div><table style="margin-top:10px;max-width:320px"><tr><th>Período</th><th>Promedio</th></tr>${[...db.tcp].sort((a,b)=>b.p.localeCompare(a.p)).map(x=>`<tr><td>${x.p}</td><td>${fm(x.v)}</td></tr>`).join('')||'<tr><td class="sub">Sin cargas</td></tr>'}</table></div>
<div class="pn"><h3>Servicios</h3>${sw('indexa','Indexación de servicios al dólar','Si está activa, la tabla de Servicios muestra "Actualizar todos / seleccionados".')}</div>
<div class="pn"><h3>Presupuestos</h3>${se('ivaModo','Detalle del IVA',[['linea','En cada línea de servicio'],['final','En el subtotal final']])}${se('desc','Descuentos',[['ninguno','Sin descuentos'],['linea','Por línea'],['global','Global']])}${nu('iva','Alícuota de IVA por defecto (%)')}${nu('validez','Validez (días): vence el = fecha de envío + validez')}${nu('segDias','Seguimiento cada (días): próximo = último seguimiento (o envío) + días')}${sw('reabrir','Permitir reabrir líneas rechazadas','Si se apaga, una línea rechazada queda cerrada.')}</div>
<div class="pn"><h3>Operaciones, gastos y maestros</h3>${sw('autoIni','Inicio automático de OT','Cuando llega la fecha prevista de inicio, la OT Autorizada pasa sola a En ejecución. El botón manual sigue disponible para adelantarla.')}${se('smModo','Generación de la OT de Servicios Mensuales',[['manual','Manual (botón)'],['auto','Automática (el día de generación del contrato)']])}${sw('aprob','Requiere aprobación de gastos','Registrado → Aprobado.')}${nu('max','Límite blando de contactos / cuentas bancarias por titular')}${nu('umbA','Monotributo: umbral de aviso (%)')}${nu('umbC','Monotributo: umbral crítico (%)')}</div>`}
function vCoop(){const c=db.coop,im=(k,l)=>`<label>${l}</label><input type="file" accept="image/*" onchange="imgCoop('${k}',this)"><img id="pc_${k}" src="${c[k]}" style="max-height:70px;margin-top:8px;display:${c[k]?'block':'none'}">`;
$('#c').innerHTML=`<div class="h1">Datos de la Cooperativa</div><p class="sub">Llenan los presupuestos cuando la Cooperativa es la emisora (igual que los datos de cada asociado cuando emite él). La condición ante IVA define el IVA sugerido.</p><div class="pn"><div class="g3">${[['razon','Razón social'],['fantasia','Nombre de fantasía'],['cuit','CUIT'],['dom','Domicilio'],['tel','Teléfono'],['mail','E-mail'],['web','Web'],['cierre','Cierre del ejercicio (día/mes)']].map(([k,l])=>`<div><label>${l}</label><input id="cp_${k}" value="${c[k]}"></div>`).join('')}<div><label>Condición ante IVA (vigente hoy)</label><input value="${coopCiva()}" readonly> <a class="lk" onclick="civaForm()">Registrar cambio de condición</a></div></div><p class="sub">Historial de condición ante IVA: ${[...db.civaHist].sort((a,b)=>b.desde.localeCompare(a.desde)).map(x=>x.civa+' desde '+x.desde).join(' · ')}. Los documentos y los asientos usan la condición vigente en su fecha.</p><label>Condiciones comerciales / pie del presupuesto</label><input id="cp_cond" value="${c.cond}"><label>Texto de firma (nombre, título, matrícula)</label><input id="cp_ftxt" value="${c.ftxt}">${im('logo','Logo')}${im('firma','Firma digital')}<div style="margin-top:12px"><button class="btn primary" onclick="saveCoop()">Guardar</button></div></div>`}
function imgCoop(k,i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{db.coop[k]=r.result;$('#pc_'+k).src=r.result;$('#pc_'+k).style.display='block'};r.readAsDataURL(f)}
const coopCiva=f=>([...db.civaHist].filter(x=>x.desde<=(f||hoy())).sort((a,b)=>b.desde.localeCompare(a.desde))[0]||{civa:'Resp. Inscripto'}).civa;
function civaForm(){openM(`<h3>Cambio de condición ante IVA</h3><p class="sub">Se conserva el historial: los documentos anteriores siguen con la condición que regía en su fecha.</p><label>Rige desde</label><input type="date" id="cvd" value="${hoy()}"><label>Nueva condición</label><select id="cvc">${['Resp. Inscripto','Monotributo','Exento'].map(x=>`<option>${x}</option>`).join('')}</select><div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button> <button class="btn primary" onclick="okCiva()">Guardar</button></div>`)}
function okCiva(){const d=$('#cvd').value,c=$('#cvc').value;if(!d){toast('Falta la fecha.');return}db.civaHist.push({desde:d,civa:c});db.coop.civa=coopCiva();db.log.push({tk:'coop',id:0,t:'Datos de la Cooperativa',campo:'Condición ante IVA',a:'',d:c+' desde '+d,f:now()});closeM();toast('Condición registrada. Vigente hoy: '+db.coop.civa+'.');vCoop()}
function saveCoop(){if(!/^\d{1,2}\/\d{1,2}$/.test($('#cp_cierre').value.trim())){toast('El cierre del ejercicio va como día/mes, por ejemplo 31/12.');return}['razon','fantasia','cuit','dom','tel','mail','web','cierre','cond','ftxt'].forEach(k=>db.coop[k]=$('#cp_'+k).value);toast('Datos de la Cooperativa guardados.');vCoop()}

// ===== Módulos 5 y 6: Facturación, Cobranza, Distribución y control de monotributo =====
const eps=0.005,r2=x=>Math.round(x*100)/100;
const alta=(tk,t,r)=>db.log.push({tk,id:r.id,t,campo:'—',a:'',d:'Alta',f:now()});
// --- facturas emitidas: cobrado, notas de crédito, saldo y estado se calculan
const fCob=f=>db.cobros.filter(c=>!c.anulado).reduce((t,c)=>t+c.apls.filter(a=>a.f===f.id).reduce((u,a)=>u+a.ef+(a.ri||0)+a.ret,0),0);
const fNC=f=>db.facturas.filter(n=>n.nc===f.id&&n.estado!=='Borrador').reduce((t,n)=>t+n.total,0);
const fND=f=>db.facturas.filter(n=>n.nd===f.id&&n.estado!=='Borrador').reduce((t,n)=>t+n.total,0);
const fTotEf=f=>r2(f.total-fNC(f)+fND(f));
const fSaldo=f=>r2(fTotEf(f)-(fCob(f)-(f.dev||0)));
const fEst=f=>f.estado==='Borrador'?'Borrador':f.esnc?'Nota de crédito':f.esnd?'Nota de débito':fTotEf(f)<=eps?'Acreditada':fSaldo(f)<-eps?'Crédito a resolver':fSaldo(f)<=eps?'Cobrada':fCob(f)-(f.dev||0)>eps?'Parcial':'Emitida';
function fEff(f){let neto=f.neto;const lin=f.lineas.map(l=>({ot:l.ot,neto:l.neto}));db.facturas.filter(n=>(n.nc===f.id||n.nd===f.id)&&n.estado!=='Borrador').forEach(n=>{const sg=n.esnc?-1:1;neto+=sg*n.neto;n.lineas.forEach(nl=>{const t=lin.find(x=>x.ot===nl.ot);if(t)t.neto+=sg*nl.neto})});return{neto:r2(neto),total:fTotEf(f),lin}}
const fNum=f=>f.tipo==='Interna'?'Interna':(f.pv||'')+'-'+(f.num||'');
const otFact=o=>db.facturas.filter(f=>f.estado!=='Borrador').reduce((t,f)=>t+f.lineas.filter(l=>l.ot==='ots:'+o.id).reduce((u,l)=>u+(f.esnc?-1:1)*l.neto,0),0);
const otCob=o=>db.dist.filter(d=>d.ot==='ots:'+o.id&&d.tipo!=='Ajuste'&&!d.anulada).reduce((t,d)=>t+d.base,0);
const pendNeto=o=>Math.max(0,r2((o.neto||0)-otFact(o)));
const condDias=cli=>(get((get(cli)||{}).pago)||{}).dias||0;
// --- monotributo
const limVig=a=>db.limites.filter(l=>l.asociado==='asociados:'+a.id&&l.desde<=hoy()).sort((x,y)=>y.desde.localeCompare(x.desde))[0];
function perStart(a){const step=a.perio==='Anual'?12:6,t=new Date(hoy()+'T12:00:00');let d=new Date((a.aniv||hoy().slice(0,4)+'-01-01')+'T12:00:00');for(let i=0;i<200;i++){const n=new Date(d);n.setMonth(n.getMonth()+step);if(n>t)break;d=n}for(let i=0;i<200&&d>t;i++)d.setMonth(d.getMonth()-step);return ymd(d)}
function monoMovs(a){const ref='asociados:'+a.id,ini=perStart(a),m=[];
db.facturas.filter(f=>f.emisor===ref&&f.estado!=='Borrador'&&f.fecha>=ini).forEach(f=>m.push({id:f.id,f:f.fecha,v:(f.esnc?-1:1)*f.total,x:(f.esnc?'Nota de crédito ':f.esnd?'Nota de débito ':'Factura ')+f.cod+' · '+LV(f.cliente),t:f.esnc?'Nota de crédito':f.esnd?'Nota de débito':'Factura a cliente'}));
db.fprov.filter(f=>f.prov===ref&&!f.anulada&&f.fecha>=ini).forEach(f=>m.push({id:f.id,f:f.fecha,v:f.total,x:f.cod+' · factura '+f.nfac+' a la Cooperativa',t:'Factura a la Cooperativa'}));
db.liqs.filter(l=>l.asociado===ref&&l.fecha>=ini&&l.importe>0&&!l.fp&&!l.anulada).forEach(l=>m.push({id:l.id,f:l.fecha,v:l.importe,x:l.cod+' · transferencia de la Cooperativa sin factura',t:'Transferencia de la Cooperativa'}));
db.mext.filter(x=>x.asociado===ref&&x.fecha>=ini).forEach(x=>m.push({id:x.id,f:x.fecha,v:x.monto,x:x.desc||x.tipo,t:x.tipo,aj:x.tipo==='Ajuste'}));
return m.sort((a,b)=>a.f.localeCompare(b.f)||a.id-b.id)}
function monoAcum(a){const m=monoMovs(a),aj=[...m].filter(x=>x.aj).pop();let t=0;if(aj){t=aj.v;m.filter(x=>!x.aj&&(x.f>aj.f||(x.f===aj.f&&x.id>aj.id))).forEach(x=>t+=x.v)}else m.forEach(x=>t+=x.v);return t}
function monoInfo(a,extra){const l=limVig(a);if(!l)return null;const ac=monoAcum(a);return{lim:l.limite,ac,pct:ac/l.limite*100,pct2:(ac+extra)/l.limite*100,disp:l.limite-ac}}
const monoTxt=(ref,monto)=>{const a=get(ref);if(!a||ref==='coop')return '';const i=monoInfo(a,monto);return i?' · '+Math.round(i.pct2)+'% del límite':''};
// --- distribución: cálculo
const costM=o=>db.gastos.filter(g=>g.ot==='ots:'+o.id&&g.aprob==='Aprobado'&&!g.anulado).reduce((t,g)=>t+g.items.filter(i=>i.afecta==='Sí').reduce((u,i)=>u+(i.disc?i.neto:i.total),0),0);
const reglaV=o=>db.reglas.find(r=>r.ot==='ots:'+o.id&&r.estado==='Vigente');
function splitRes(res,parts,k){const fx=parts.map(p=>p.tipo==='Fijo'?p.valor*k:0),F=fx.reduce((t,x)=>t+x,0),rem=res-F,sh=parts.map((p,i)=>({ref:p.ref,tipo:p.tipo,como:p.como,valor:p.valor,monto:p.tipo==='Fijo'?fx[i]:p.tipo==='%'?rem*p.valor/100:0})),used=sh.reduce((t,x)=>t+x.monto,0);sh.forEach(x=>{if(x.tipo==='Residual')x.monto=res-used});return sh}
function calcDist(o,b,parts){const cm=costM(o),neto=o.neto||0;let desc,res;if(o.modo==='Costos primero'){desc=Math.min(b,Math.max(0,cm-(o.costDesc||0)));res=b-desc}else{const m=neto>0?Math.max(0,(neto-cm)/neto):1;res=b*m;desc=b-res}const sh=splitRes(res,parts,neto>0?b/neto:1);return{res,desc,shares:sh,neg:sh.some(x=>x.monto<-eps)}}
function ruleErr(parts){if(!parts.length)return 'Agregá al menos un participante.';const refs=parts.map(p=>p.ref);if(new Set(refs).size!==refs.length)return 'Un participante aparece más de una vez.';const sc=parts.find(p=>p.ref!=='coop'&&!p.como);if(sc)return 'Elegí cómo participa '+LV(sc.ref)+' (Socio o Profesional): define si lo que recibe es retorno o honorarios.';if(parts.filter(p=>p.tipo==='Residual').length>1)return 'Solo puede haber un participante Residual.';const s=parts.filter(p=>p.tipo==='%').reduce((t,p)=>t+p.valor,0);if(!parts.some(p=>p.tipo==='Residual')&&Math.abs(s-100)>eps)return 'Los porcentajes suman '+s+'%: deben cerrar 100% (o agregá un participante Residual).';return ''}
function setRegla(o,parts,mot){const prev=reglaV(o);if(prev)prev.estado='Reemplazada';const r={id:nid++,ot:'ots:'+o.id,ver:prev?prev.ver+1:1,vig:hoy(),motivo:mot,estado:'Vigente',parts:parts.map(p=>({ref:p.ref,tipo:p.tipo,valor:p.valor,como:p.como}))};db.reglas.push(r);db.log.push({tk:'ots',id:o.id,t:'OT',campo:'Regla de distribución',a:prev?'v'+prev.ver:'—',d:'v'+r.ver+(mot?' — '+mot:''),f:now()});return r}
function movsDist(d,o,cash,re,receptor){d.parts.forEach(p=>{if(p.ref!=='coop'&&Math.abs(p.monto)>eps)mov(p.ref,r2(p.monto),d.cod+' · '+o.cod+' · participación')});if(receptor&&receptor!=='coop'&&cash>eps)mov(receptor,-r2(cash),d.cod+' · efectivo retenido por quien cobró');Object.entries(re||{}).forEach(([em,v])=>{if(em!=='coop'&&v>eps)mov(em,-r2(v),d.cod+' · retención absorbida por el emisor')})}
// --- editor de reglas (se usa en la OT y en cada cobro)
const _rb={};
const partOpts=sel=>`<option value="coop" ${sel==='coop'?'selected':''}>Cooperativa</option>`+db.asociados.filter(AC).map(a=>`<option value="asociados:${a.id}" ${sel==='asociados:'+a.id?'selected':''}>${a.nombre}</option>`).join('');
const defComo=ref=>{const a=get(ref);if(!a||ref==='coop')return '';return a.vinculo==='Socio cooperativo'?'Socio':a.vinculo==='Monotributista/Autónomo'?'Profesional':''};
function rPart(el){const tr=el.closest('tr');tr.querySelector('.rc').value=defComo(el.value);rUpd(el.closest('.rbox').dataset.ot)}
const rRow=p=>`<tr><td><select class="rp" onchange="rPart(this)">${partOpts(p.ref)}</select></td><td><select class="rt" onchange="rUpd(this.closest('.rbox').dataset.ot)">${['%','Fijo','Residual'].map(x=>`<option ${p.tipo===x?'selected':''}>${x}</option>`).join('')}</select></td><td><input class="rv" type="number" value="${p.valor??0}" style="width:100px" oninput="rUpd(this.closest('.rbox').dataset.ot)"></td><td><select class="rc" onchange="rUpd(this.closest('.rbox').dataset.ot)">${[['','—'],['Socio','Socio'],['Profesional','Profesional']].map(([v,n])=>`<option value="${v}" ${(p.como!==undefined?p.como:defComo(p.ref))===v?'selected':''}>${n}</option>`).join('')}</select></td><td class="ra"></td><td><a class="lk" onclick="const b=this.closest('.rbox').dataset.ot;this.closest('tr').remove();rUpd(b)">✕</a></td></tr>`;
function rEd(oid,parts,b){_rb[oid]={b};return `<div class="rbox" data-ot="${oid}"><table><tr><th>Participante</th><th>Tipo</th><th>Valor</th><th>Como</th><th>Monto</th><th></th></tr>${parts.map(rRow).join('')}</table><a class="lk" onclick="rAdd(${oid})">+ Participante</a><div class="note" id="rm_${oid}" style="margin-top:8px"></div></div>`}
function rAdd(oid){document.querySelector(`.rbox[data-ot="${oid}"] table`).insertAdjacentHTML('beforeend',rRow({ref:'coop',tipo:'%',valor:0}));rUpd(oid)}
const rRead=oid=>[...document.querySelectorAll(`.rbox[data-ot="${oid}"] tr`)].slice(1).map(tr=>({ref:tr.querySelector('.rp').value,tipo:tr.querySelector('.rt').value,valor:+tr.querySelector('.rv').value||0,como:tr.querySelector('.rc').value}));
function rUpd(oid){const o=db.ots.find(x=>x.id==oid),parts=rRead(oid),e=ruleErr(parts),c=calcDist(o,_rb[oid].b,parts),m=$('#rm_'+oid);
document.querySelectorAll(`.rbox[data-ot="${oid}"] tr`).forEach((tr,i)=>{if(i)tr.querySelector('.ra').textContent=e?'—':fm(c.shares[i-1].monto)+monoTxt(parts[i-1].ref,c.shares[i-1].monto)});
m.className='note'+(e?' err':'');m.textContent=e||('Resultado distribuible '+fm(c.res)+' (costos descontados '+fm(c.desc)+'). La regla cierra correctamente ✅'+(c.neg?' ⚠ Hay montos negativos: los importes fijos superan el resultado.':''))}
function distOT(id){const o=db.ots.find(x=>x.id==id),rg=reglaV(o),hs=db.reglas.filter(r=>r.ot==='ots:'+o.id).sort((a,b)=>b.ver-a.ver);
openM(`<h3>Distribución · ${o.cod}</h3><p class="sub">${o.servicio} · neto ${fm(o.neto)} · ${rg?'regla vigente v'+rg.ver+' desde '+rg.vig:'sin regla todavía'}. Cada cambio crea una nueva versión (la anterior nunca se pisa). La columna Monto es la proyección si se cobrara hoy todo el neto con los costos cargados hasta ahora.</p><label>Modo en cobros parciales</label><select id="rmo"><option ${o.modo!=='Costos primero'?'selected':''}>Proporcional</option><option ${o.modo==='Costos primero'?'selected':''}>Costos primero</option></select>${rEd(o.id,rg?rg.parts:[{ref:'coop',tipo:'%',valor:100}],o.neto)}${rg?'<label>Motivo del cambio (obligatorio si modificás la regla)</label><input id="rmt">':''}${hs.length>1?`<p class="sub">Versiones: ${hs.map(r=>'v'+r.ver+' ('+r.estado+(r.motivo?' · '+r.motivo:'')+')').join(' · ')}</p>`:''}<div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Cerrar</button> <button class="btn primary" onclick="saveR(${id})">Guardar</button></div>`);rUpd(o.id)}
function saveR(id){const o=db.ots.find(x=>x.id==id),parts=rRead(id),e=ruleErr(parts);if(e){toast(e);return}const rg=reglaV(o),ch=!rg||JSON.stringify(parts.map(p=>[p.ref,p.tipo,p.valor,p.como||'']))!==JSON.stringify(rg.parts.map(p=>[p.ref,p.tipo,p.valor,p.como||''])),modo=$('#rmo').value;let msg='';
if(ch&&rg&&!($('#rmt').value||'').trim()){toast('El motivo del cambio es obligatorio.');return}
if(modo!==(o.modo||'Proporcional')){db.log.push({tk:'ots',id,t:'OT',campo:'Modo en cobros parciales',a:o.modo||'Proporcional',d:modo,f:now()});o.modo=modo;msg='Modo actualizado. '}
if(ch){setRegla(o,parts,rg?$('#rmt').value.trim():'Primera regla');msg+='Regla v'+reglaV(o).ver+' guardada.'}
closeM();toast(msg||'Sin cambios.');nav('ots')}
// --- cierre de OT con ajuste de distribución

function liq(a){const s=r2(db.ctacte.filter(m=>m.a===a).reduce((t,m)=>t+m.v,0));if(Math.abs(s)<eps){toast('El saldo ya está en cero.');return}const pos=s>0;
openM(`<h3>${pos?'Liquidar a '+LV(a):LV(a)+' paga a la Cooperativa'}</h3><p class="sub">Saldo ${fm(s)}. ${pos?'La Cooperativa le debe al asociado.':'El asociado debe a la Cooperativa.'}</p><label>Importe</label><input type="number" id="lv" value="${Math.abs(s)}"><label>Fecha</label><input type="date" id="lf" value="${hoy()}"><label>Cuenta desde la que se paga (${pos?'Cooperativa':'asociado'})</label><select id="lo">${ctaOpts(pos?'coop':a)}</select><label>Cuenta a la que se paga (${pos?'asociado':'Cooperativa'})</label><select id="ld2">${ctaOpts(pos?a:'coop')}</select>${pos?`<label>Comprobante del asociado</label><select id="lc"><option value="">Transferencia sin factura</option>${fpAbiertas(a).map(f=>`<option value="${f.id}">Factura ${f.nfac} · ${f.cod} · saldo ${fm(f.total-f.pagado)}</option>`).join('')}</select><p class="sub">Si el asociado le facturó a la Cooperativa, registrá esa factura en Facturas de proveedor (eligiéndolo a él) y elegila acá: el pago la cancela. Para su límite de monotributo cuenta la factura; si no hay factura, cuenta la transferencia.</p>`:''}<div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button> <button class="btn primary" onclick="okLiq('${a}',${pos?1:0})">Registrar</button></div>`)}
function okLiq(a,pos){const v=+$('#lv').value;if(!(v>0)){toast('Importe inválido.');return}let fp=null;if(pos&&$('#lc').value){fp=db.fprov.find(x=>x.id==$('#lc').value);rfp(fp);if(v>fp.total-fp.pagado+eps){toast('El importe supera el saldo de la factura ('+fm(fp.total-fp.pagado)+').');return}}
const l=add('liqs',{asociado:a,fecha:$('#lf').value,importe:pos?v:-v,fp:fp?fp.id:null,orig:$('#lo').value,dest:$('#ld2').value});alta('liqs','Liquidaciones',l);mov(a,pos?-v:v,l.cod+(pos?' · liquidación al asociado':' · pago del asociado a la Cooperativa'));if(fp){fp.pagos.push({f:l.fecha,m:'Liquidación '+l.cod,v,cta:l.dest});rfp(fp)}closeM();toast('Liquidación '+l.cod+' registrada.'+(fp?' Se aplicó como pago de la factura '+fp.cod+'.':''));vCC()}
function vCC(){const sal={};db.ctacte.forEach(m=>sal[m.a]=(sal[m.a]||0)+m.v);
$('#c').innerHTML=`<div class="h1">Cuenta corriente de asociados</div><p class="sub">Libro de movimientos; el saldo siempre se calcula. (+) la cooperativa le debe al asociado · (−) el asociado debe a la cooperativa.</p><div class="pn"><h3>Saldos</h3><table><tr><th>Asociado</th><th>Saldo</th><th></th></tr>${Object.entries(sal).map(([a,v])=>`<tr><td>${LV(a)}</td><td>${fm(v)}</td><td>${Math.abs(v)>eps?`<button class="btn" onclick="liq('${a}')">Liquidar saldo</button>`:''}</td></tr>`).join('')||'<tr><td class="sub">Sin movimientos</td></tr>'}</table></div><div class="pn"><h3>Movimientos</h3><table><tr><th>Fecha</th><th>Asociado</th><th>Concepto</th><th>Importe</th></tr>${db.ctacte.map(m=>`<tr><td>${m.f}</td><td>${LV(m.a)}</td><td>${m.x}</td><td>${fm(m.v)}</td></tr>`).join('')}</table></div><div class="pn"><h3>Liquidaciones</h3><table><tr><th>Código</th><th>Fecha</th><th>Asociado</th><th>Importe</th><th>Comprobante</th><th>Desde</th><th>Hacia</th><th></th></tr>${db.liqs.map(l=>`<tr${l.anulada?' style="opacity:.55"':''}><td>${l.cod}</td><td>${l.fecha}</td><td>${LV(l.asociado)}</td><td>${fm(l.importe)}</td><td>${l.importe<0?'Pago a la Cooperativa':l.fp?'Factura '+get('fprov:'+l.fp).nfac+' ('+get('fprov:'+l.fp).cod+')':'Transferencia sin factura'}</td><td>${l.orig?ctaL(l.orig):'—'}</td><td>${l.dest?ctaL(l.dest):'—'}</td><td>${l.anulada?'<span class="bd no" title="'+l.manu+'">Anulada</span>':`<button class="btn" onclick="rvLiq(${l.id})">Revertir</button>`}</td></tr>`).join('')||'<tr><td class="sub">Sin liquidaciones</td></tr>'}</table></div>`}
// --- control de monotributo
function vMono(){const as=db.asociados.filter(a=>AC(a)&&(a.civa==='Monotributo'||limVig(a)));
$('#c').innerHTML=`<div class="h1">Control de monotributo</div><p class="sub">Acumulado del período de cada asociado = facturas que emitió + lo que le facturó a la Cooperativa o le transfirió la Cooperativa sin factura + ingresos por fuera del circuito (facturas propias, transferencias recibidas) o un ajuste. Umbrales: aviso ${cfg.umbA}% · crítico ${cfg.umbC}%.</p><div class="pn"><table><tr><th>Asociado</th><th>Categoría</th><th>Período desde</th><th>Acumulado</th><th>Límite</th><th>Uso</th><th></th></tr>${as.map(a=>{const l=limVig(a),ac=monoAcum(a),p=l?ac/l.limite*100:0;return `<tr><td>${a.nombre}<br><span class="sub">${a.civa} · ${a.vinculo}</span></td><td>${l?LV(l.cat):'—'}</td><td>${perStart(a)} (${a.perio||'Semestral'})</td><td>${fm(ac)}</td><td>${l?fm(l.limite):'<span class="sub">sin límite cargado</span>'}</td><td>${l?`<span class="bd ${p>=cfg.umbC?'no':p>=cfg.umbA?'wa':'ok'}">${p>100?'EXCEDIDO ':''}${Math.round(p)}%</span>`:'—'}</td><td style="white-space:nowrap"><button class="btn" onclick="monoDet(${a.id})">Detalle</button> <button class="btn" onclick="monoExt(${a.id})">+ Ingreso externo</button> <button class="btn" onclick="monoAj(${a.id})">Ajuste</button> <button class="btn" onclick="monoLim(${a.id})">Límite</button></td></tr>`}).join('')||'<tr><td class="sub">Ningún asociado monotributista activo.</td></tr>'}</table></div>`}
function monoDet(id){const a=db.asociados.find(x=>x.id==id),m=monoMovs(a);openM(`<h3>${a.nombre} · período desde ${perStart(a)}</h3><table><tr><th>Fecha</th><th>Origen</th><th>Detalle</th><th>Importe</th></tr>${m.map(x=>`<tr><td>${x.f}</td><td>${x.t}</td><td>${x.x}</td><td>${fm(x.v)}</td></tr>`).join('')||'<tr><td class="sub">Sin movimientos</td></tr>'}</table><p class="sub">Acumulado: <b>${fm(monoAcum(a))}</b>${m.some(x=>x.aj)?' (calibrado con el último ajuste: cuenta lo posterior a esa fecha)':''}</p><div style="text-align:right;margin-top:12px"><button class="btn" onclick="closeM()">Cerrar</button></div>`)}
function monoExt(id){openM(`<h3>Ingreso por fuera del circuito</h3><p class="sub">Facturas propias o transferencias recibidas que no pasan por la Cooperativa pero cuentan para su límite.</p><label>Tipo</label><select id="mt"><option>Factura propia</option><option>Transferencia recibida</option></select><label>Fecha</label><input type="date" id="mf2" value="${hoy()}"><label>Importe</label><input type="number" id="mm"><label>Descripción (opcional)</label><input id="md2"><div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button> <button class="btn primary" onclick="okMono(${id},0)">Guardar</button></div>`)}
function monoAj(id){const a=db.asociados.find(x=>x.id==id);openM(`<h3>Ajuste del acumulado</h3><p class="sub">Fija el acumulado en una fecha (por ejemplo, lo que ya llevaba facturado al arrancar): desde ahí solo suman los movimientos posteriores.</p><input type="hidden" id="mt" value="Ajuste"><label>Fecha</label><input type="date" id="mf2" value="${hoy()}"><label>Acumulado a esa fecha</label><input type="number" id="mm" value="${monoAcum(a)}"><label>Descripción (opcional)</label><input id="md2"><div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button> <button class="btn primary" onclick="okMono(${id},1)">Guardar</button></div>`)}
function okMono(id,aj){const m=+$('#mm').value;if(!(m>=0)||(!aj&&!(m>0))){toast('Importe inválido.');return}const x=add('mext',{asociado:'asociados:'+id,fecha:$('#mf2').value,monto:m,tipo:$('#mt').value,desc:$('#md2').value});db.log.push({tk:'asociados',id,t:'Asociados',campo:'Monotributo · '+x.tipo,a:'',d:fm(m)+' ('+x.fecha+')',f:now()});closeM();toast('Registrado.');vMono()}
function monoLim(id){const a=db.asociados.find(x=>x.id==id),l=limVig(a),h=db.limites.filter(x=>x.asociado==='asociados:'+id).sort((p,q)=>q.desde.localeCompare(p.desde));openM(`<h3>Límite de ${a.nombre}</h3><p class="sub">Se versiona: una nueva categoría o límite rige desde una fecha y conserva las anteriores.${h.length?'<br>Versiones: '+h.map(x=>LV(x.cat)+' '+fm(x.limite)+' desde '+x.desde).join(' · '):''}</p><label>Categoría</label><select id="lk2">${listOpts('Categorías de monotributo',l?l.cat:'')}</select><label>Límite del período</label><input type="number" id="ll" value="${l?l.limite:''}"><label>Rige desde</label><input type="date" id="ld" value="${hoy()}"><div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeM()">Cancelar</button> <button class="btn primary" onclick="okLim(${id})">Guardar</button></div>`)}
function okLim(id){const v=+$('#ll').value;if(!(v>0)){toast('Cargá el límite.');return}add('limites',{asociado:'asociados:'+id,limite:v,cat:$('#lk2').value,desde:$('#ld').value});db.log.push({tk:'asociados',id,t:'Asociados',campo:'Límite de monotributo',a:'',d:fm(v)+' desde '+$('#ld').value,f:now()});closeM();toast('Límite versionado guardado.');vMono()}
